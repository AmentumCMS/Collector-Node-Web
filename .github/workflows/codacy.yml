name: Codacy Security Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: ["main", "develop" ]
  schedule:
    - cron: "22 2 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Split Codacy SARIF runs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sarif-runs

          run_count="$(jq '.runs | length' results.sarif)"
          echo "Codacy SARIF run count: ${run_count}"

          for i in $(seq 0 $((run_count - 1))); do
            jq --argjson i "$i" '
              . as $root
              | {
                  version: $root.version,
                  "$schema": $root["$schema"],
                  runs: [
                    (
                      $root.runs[$i]
                      | .automationDetails.id = (
                          "codacy-run-" + ($i | tostring)
                        )
                    )
                  ]
                }
            ' results.sarif > "sarif-runs/codacy-${i}.sarif"
          done

          echo "Generated split SARIF files:"
          ls -la sarif-runs

      - name: Upload Codacy SARIF runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-runs/codacy-*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No SARIF files found, skipping upload."
            exit 0
          fi
          for sarif_file in "${files[@]}"; do
            echo "Uploading $sarif_file ..."
            encoded=$(gzip -c "$sarif_file" | base64 -w 0)
            gh api \
              --method POST \
              "/repos/${{ github.repository }}/code-scanning/sarifs" \
              -f "commit_sha=${{ github.sha }}" \
              -f "ref=${{ github.ref }}" \
              -f "sarif=${encoded}"
          done
          echo "Uploaded ${#files[@]} SARIF file(s)."
