nodeLinker: node-modules

enableGlobalCache: true
enableImmutableInstalls: false
enableHardenedMode: false
enableMirror: true
# npmRegistryServer: "http://localhost:4873"
unsafeHttpWhitelist: ["localhost"]

supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - linux
    - win32
    - win64
